[project]
name = "flask-traffic"
version = "0.8.2"
description = "Store and monitor site traffic."
authors = [{ name = "David Carmichael", email = "david@uilix.com" }]
readme = "README.md"
license = { file = "LICENSE.txt" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Framework :: Flask",
    "Natural Language :: English",
]
requires-python = ">=3.9"
dependencies = ["Flask"]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy"]
flask-sqlalchemy = ["flask-sqlalchemy"]
redis = ["redis"]

[project.urls]
Source = "https://github.com/CheeseCake87/flask-traffic"

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
include = ["src/**/*.py"]

[dependency-groups]
dev = [
    "mypy>=1.18.1",
    "pyright>=1.1.405",
    "pytest>=8.4.2",
]

[tool.mypy]
python_version = "3.9"
files = ["src/flask_traffic"]
show_error_codes = true
pretty = true
strict = true
warn_unused_ignores = false

[tool.pyright]
pythonVersion = "3.9"
include = ["src/flask_traffic"]
typeCheckingMode = "basic"
